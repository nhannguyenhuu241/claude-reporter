# Nginx config for claude-reporter
# Place in: /etc/nginx/sites-available/claude-reporter
# Then: ln -s /etc/nginx/sites-available/claude-reporter /etc/nginx/sites-enabled/
# Then: nginx -t && systemctl reload nginx

server {
    listen 80;
    # Replace with your domain or leave as _ for IP-only access
    server_name _;

    # Optional: restrict to specific IPs (uncomment to enable)
    # allow 1.2.3.4;   # your office IP
    # allow 10.0.0.0/8; # internal network
    # deny all;

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;

        # Required for Socket.io WebSocket upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout for long-polling fallback
        proxy_read_timeout 86400;
    }
}
